name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dokon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dokon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migratsiyalar to'liqligi
        run: DJANGO_SETTINGS_MODULE=config.settings.test python manage.py makemigrations --check --dry-run
      - name: Testlar
        run: pytest --cov=apps --cov-report=term-missing
      - name: OpenAPI sxema
        run: DJANGO_SETTINGS_MODULE=config.settings.test python manage.py spectacular --validate --fail-on-warn --file openapi.yml
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.yml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t onlayn-dokon-api backend

  deploy-demo:
    # main'ga push bo'lganda demo Hugging Face Space'ga joylanadi (HF_TOKEN secret kerak).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'azizmuksinov/onlayn-dokon-demo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: env.HF_TOKEN != ''
        run: pip install "huggingface_hub>=0.30" && python infra/hf-space/deploy.py
