# Demo konteyner: bitta tashqi port (7860). /api, /admin, /static -> Django (gunicorn :8000); qolgani -> Next (:3000).
# Root'siz ishlaydi (HF Spaces uid 1000): pid va vaqtinchalik fayllar /tmp da.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;
    client_max_body_size 12m;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

    upstream django { server 127.0.0.1:8000; }
    upstream web { server 127.0.0.1:3000; }

    server {
        listen 7860;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;

        location /api/ { proxy_pass http://django; }
        location /admin { proxy_pass http://django; }
        location /static/ { proxy_pass http://django; }
        location = /health { proxy_pass http://django; }
        location / { proxy_pass http://web; }
    }
}
